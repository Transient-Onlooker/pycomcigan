name: Offline parser candidate QA
on:
  push:
    branches:
      - qa/offline-timetable-parser
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install poetry==2.1.3
      - run: poetry install --no-interaction
      - name: Offline regression
        run: poetry run python -W error -m pytest -q
      - name: Live parser health (existing read-only checker)
        run: poetry run python -m scripts.check_live_parser
